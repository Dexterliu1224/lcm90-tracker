name: Build Windows exe

# Same proven pipeline as telescope-tracker: install -> test -> build ->
# SMOKE TEST the exe (launch it, hit the web page) -> upload artifact.
# The smoke test is what catches PyInstaller's silent missing-module
# failures before anyone downloads a broken exe.
#
# ASCII-only on purpose: this file travels through web editors and
# clipboards where non-ASCII has been mangled before.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # httpx is a TEST-only dep (fastapi TestClient needs it).
          # Deliberately not in requirements.txt: it would be bundled
          # into the exe for no reason.
          pip install pyinstaller pytest httpx

      - name: Run tests
        run: python -m pytest tests/ -q

      # serve.py imports the app object directly (never a string path),
      # and we still collect app/core explicitly: PyInstaller's static
      # analysis has missed dynamically-imported modules here before.
      # --onedir, not --onefile: a onefile exe unpacks ~150 MB to a temp dir
      # on EVERY launch, so the user double-clicks and stares at nothing for
      # half a minute. With --windowed there is not even a console to show
      # progress, so they double-click again and get two instances.
      # --windowed: this is a desktop app now (pywebview window), a black
      # console box behind it looks broken. serve.py redirects stdout to
      # data/app.log when there is no console, so crashes stay diagnosable.
      - name: Build exe
        run: >
          pyinstaller
          --noconfirm
          --onedir
          --windowed
          --icon app.ico
          --name lcm90-tracker
          --collect-all webview
          --collect-all pythonnet
          --collect-all clr_loader
          --hidden-import clr
          --add-data "app/static/index.html;app/static"
          --add-data "app/static/login.html;app/static"
          --add-data "app/static/favicon.ico;app/static"
          --add-data "app/static/app-badge.png;app/static"
          --collect-submodules app
          --collect-submodules core
          --collect-submodules uvicorn
          --hidden-import app.main
          --hidden-import uvicorn.loops.asyncio
          --hidden-import uvicorn.protocols.http.h11_impl
          --hidden-import uvicorn.protocols.http.httptools_impl
          --hidden-import uvicorn.protocols.websockets.websockets_impl
          --hidden-import uvicorn.lifespan.on
          --hidden-import PIL._tkinter_finder
          serve.py

      - name: Assemble release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          # --onedir puts the exe plus its _internal folder under dist/<name>/
          Copy-Item dist/lcm90-tracker/* release/ -Recurse -Force
          New-Item -ItemType Directory -Force -Path release/data | Out-Null
          Copy-Item config.yaml            release/
          Copy-Item README.md              release/
          Get-ChildItem release | Select-Object Name, Length

      # The GUI window itself cannot be opened on a headless runner, but the
      # thing that actually breaks in packaging is "pywebview/pythonnet did
      # not get bundled" - and --check tests exactly that, headlessly.
      - name: Check the WebView components got packaged
        shell: pwsh
        working-directory: release
        run: |
          $out = & .\lcm90-tracker.exe --check 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "--check failed with $LASTEXITCODE" }
          if ($out -notmatch 'WebView') {
            # --windowed exes have no console, so the text lands in the log
            if (Test-Path data/app.log) { Get-Content data/app.log -Tail 40 }
            throw "--check produced no WebView report"
          }

      - name: Smoke test the exe
        shell: pwsh
        working-directory: release
        run: |
          # --no-window: the HTTP server still comes up, we just skip the GUI.
          # stdout/stderr are captured so failures show the real error; with
          # --windowed they are usually empty and data/app.log has the goods.
          $p = Start-Process -FilePath .\lcm90-tracker.exe `
                             -ArgumentList '--port','8323','--no-window' `
                             -PassThru -WindowStyle Hidden `
                             -RedirectStandardOutput exe-stdout.txt `
                             -RedirectStandardError  exe-stderr.txt
          $ok = $false
          try {
            foreach ($i in 1..60) {
              if ($p.HasExited) {
                Write-Host "--- exe stdout ---"
                if (Test-Path exe-stdout.txt) { Get-Content exe-stdout.txt }
                Write-Host "--- exe stderr ---"
                if (Test-Path exe-stderr.txt) { Get-Content exe-stderr.txt }
                Write-Host "--- data/app.log ---"
                if (Test-Path data/app.log) { Get-Content data/app.log -Tail 60 }
                throw "exe exited immediately, code $($p.ExitCode)"
              }
              Start-Sleep -Seconds 2
              try {
                # Poll /login: it is the only page reachable without a
                # session, and it also proves login.html got bundled.
                $r = Invoke-WebRequest -Uri http://127.0.0.1:8323/login `
                                       -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) {
              Write-Host "--- exe stdout ---"
              if (Test-Path exe-stdout.txt) { Get-Content exe-stdout.txt }
              Write-Host "--- exe stderr ---"
              if (Test-Path exe-stderr.txt) { Get-Content exe-stderr.txt }
              Write-Host "--- data/app.log ---"
              if (Test-Path data/app.log) { Get-Content data/app.log -Tail 60 }
              throw "login page still not reachable after 120 s"
            }

            # The login gate must actually be closed. If this ever starts
            # returning 200 the exe is shipping an unprotected telescope.
            $un = Invoke-WebRequest -Uri http://127.0.0.1:8323/api/status `
                                    -UseBasicParsing -SkipHttpErrorCheck `
                                    -TimeoutSec 10
            if ($un.StatusCode -ne 401) {
              throw "API without login returned $($un.StatusCode), expected 401"
            }

            # Factory account must work on a fresh install.
            $login = Invoke-WebRequest -Uri http://127.0.0.1:8323/api/login `
                                       -Method POST -ContentType 'application/json' `
                                       -Body '{"username":"admin","password":"admin"}' `
                                       -SessionVariable sess `
                                       -UseBasicParsing -TimeoutSec 15
            if ($login.StatusCode -ne 200) { throw "login failed: $($login.StatusCode)" }

            $s = Invoke-WebRequest -Uri http://127.0.0.1:8323/api/status `
                                   -WebSession $sess -UseBasicParsing -TimeoutSec 15
            if ($s.StatusCode -ne 200) { throw "API returned $($s.StatusCode)" }
            if ($s.Content -notmatch '"record"') {
              throw "status payload has no record section"
            }

            # NOT $home: that is a read-only PowerShell automatic variable and
            # assigning to it aborts the script with exit code 1.
            $console = Invoke-WebRequest -Uri http://127.0.0.1:8323/ `
                                         -WebSession $sess -UseBasicParsing -TimeoutSec 15
            if ($console.StatusCode -ne 200) { throw "console page returned $($console.StatusCode)" }

            Write-Host "OK: exe starts, login gate closed, admin/admin works, API responds"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Remove-Item exe-stdout.txt, exe-stderr.txt -ErrorAction SilentlyContinue
          }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: lcm90-tracker-windows
          path: release/
          retention-days: 90

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path release/* -DestinationPath lcm90-tracker-windows.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: lcm90-tracker-windows.zip
